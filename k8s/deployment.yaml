apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-scheduling-toy
  labels:
    app: gpu-scheduling-toy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gpu-scheduling-toy
  template:
    metadata:
      labels:
        app: gpu-scheduling-toy
    spec:
      containers:
        - name: gpu-scheduling-toy
          image: gpu-scheduling-toy:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: GPU_COUNT
              value: "8"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]